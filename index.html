    <script>
      // Filter out benign Vite HMR websocket notices in sandboxed preview iframe
      (function() {
        var isBenignViteNotice = function(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
          return str.indexOf('[vite]') !== -1 || 
                 str.indexOf('websocket') !== -1 || 
                 str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('failed to connect') !== -1 ||
                 str.indexOf('ws://') !== -1 ||
                 str.indexOf('wss://') !== -1;
        };

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isBenignViteNotice(arguments[i])) {
                return;
              }
            }
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('unhandledrejection', function(e) {
          if (e && isBenignViteNotice(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        });

        window.addEventListener('error', function(e) {
          if (e && isBenignViteNotice(e.message || e.error)) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      })();
    </script>
